[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everythingtohtml"
dynamic = ["version"]
description = "Convert PDF, Office, data, and markup files into clean, self-contained HTML — for humans and for LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "html",
    "converter",
    "markdown",
    "docx",
    "xlsx",
    "pptx",
    "csv",
    "json",
    "document-conversion",
    "llm",
    "rag",
]
authors = [{ name = "everythingtohtml contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "charset-normalizer>=3.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "mdurl>=0.1",
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
    "puremagic>=1.20",
]

[project.optional-dependencies]
docx = ["mammoth>=1.6"]
doc = ["olefile>=0.46"]
xlsx = ["openpyxl>=3.1"]
pptx = ["python-pptx>=0.6.21"]
pdf = ["pdfminer.six>=20231228"]
rst = ["docutils>=0.20"]
yaml = ["PyYAML>=6.0"]
all = [
    "mammoth>=1.6",
    "olefile>=0.46",
    "openpyxl>=3.1",
    "python-pptx>=0.6.21",
    "pdfminer.six>=20231228",
    "docutils>=0.20",
    "PyYAML>=6.0",
]

[project.scripts]
everythingtohtml = "everythingtohtml.__main__:main"
e2h = "everythingtohtml.__main__:main"

[project.urls]
Homepage = "https://github.com/He-wei-gui/everythingtohtml"
Repository = "https://github.com/He-wei-gui/everythingtohtml"
Issues = "https://github.com/He-wei-gui/everythingtohtml/issues"
Changelog = "https://github.com/He-wei-gui/everythingtohtml/blob/main/CHANGELOG.md"

[project.entry-points."everythingtohtml.converter"]
# Third-party plugins register converters here. See docs/PLUGINS.md.

[tool.hatch.version]
path = "src/everythingtohtml/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/everythingtohtml"]

[tool.hatch.build.targets.sdist]
include = ["src/everythingtohtml", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # docutils <2.0 emits this; the kwarg is still required on the versions we support.
    "ignore:Argument \"writer_name\" will be removed:PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
