name: Feature request
description: Suggest a new format or capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Format involved (if any)
      placeholder: ".epub"
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How might it look as an API or CLI? Any libraries that could help?
